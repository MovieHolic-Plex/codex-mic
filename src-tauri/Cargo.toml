[package]
name = "codex-mic"
version = "0.2.0"
description = "Codex Mic — a Tauri app that exposes Codex's thread realtime (mic) API"
edition = "2021"
rust-version = "1.77"

[lib]
name = "codex_mic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
webrtc = "0.17.2"
bytes = "1.12.1"
audiopus_sys = { version = "0.2.2", features = ["static"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
enigo = "0.6"
cpal = "0.15"
base64 = "0.22"
reqwest = { version = "0.13.3", features = ["json"] }
time = { version = "0.3.41", features = ["formatting"] }
rustls = { version = "0.23.42", features = ["ring"] }
arboard = "3.6.1"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.33"

[target.'cfg(windows)'.dependencies]
# Keyboard toggle/hold state: caps restoration by comparison, and holding the
# transcript back until Ctrl/Shift/Alt/Win are physically up.
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
